name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the site build
        run: python -m unittest discover -s tests -v

      - name: Check the page scripts
        run: |
          cp web/app.js /tmp/app.mjs && cp web/lib.js /tmp/lib.mjs
          node --check /tmp/app.mjs && node --check /tmp/lib.mjs
          node --test tests/lib.test.mjs
